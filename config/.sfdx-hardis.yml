devHubUsername: ""
enableDeltaDeploymentBetweenMajorBranches: false
enablePromotionBranches: true
enableDeploymentApexTestClasses: false
enableDeprecatedDeploymentPlan: false
installPackagesDuringCheckDeploy: false
notifTranslateDeploymentMessages: false
offerSandboxInit: false
sharedDevSandboxes: false
serviceNowAddDeploymentTag: false
serviceNowCommentField: work_notes
useDeltaDeployment: false
useDeltaDeploymentWithDependencies: false
useSmartDeploymentTests: false
allowedPromotionSteps:
