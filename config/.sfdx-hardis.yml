projectName: HeliosEnergy
developmentBranch: integration
productionBranch: main
# How the CI job gets into an org. Levels 1 and 2 use auth URLs kept in
# GitHub secrets, which is the shortcut, so there is no certificate to look for
# and the pipeline is right not to ask for one. Lab 3.1 gives preprod and main a
# JWT certificate and leaves integration and uat on the shortcut, which a real
# project would not do, so this setting stays as it is.
orgAuthenticationMode: secretsOnly
# One entry on purpose. A contributor at Levels 1 and 2 has exactly one place
# to send a User Story, and a question with one answer is a question that
# cannot be got wrong. uat is a major branch all the same: work reaches it by
# promotion, never by a User Story. Lab 3.1 adds preprod here, for hotfixes.
availableTargetBranches:
  - integration
  - preprod
availableTargetBranchesLabels:
  - The shared integration org, where every contributor merges
  - Hotfixes on the production version, agreed with the release manager
branchPrefixChoices:
  - value: features
    title: "Feature: a new capability or an improvement"
  - value: fix
    title: "Fix: correct something that is broken"
  - value: retrofit
    title: "Retrofit: merge production back down into the pipeline after a hotfix (release manager)"
newTaskNameRegex: '^US-\d{3}-[a-z0-9-]+$'
newTaskNameRegexExample: "US-014-panels-required"
# The stories live in the backlog of this course, not in a ticketing tool. These
# keys let the Pull Request comments link every US-nnn they meet to its page, and
# write its title next to the link, read from the JSON the site publishes per story.
genericTicketingProviderRegex: "(US-[0-9]{3})"
genericTicketingProviderUrlBuilder: "https://sfdx-hardis-training.github.io/BACKLOG/{REF}/"
genericTicketingProviderDetailsUrlBuilder: "https://sfdx-hardis-training.github.io/BACKLOG/{REF}.json"
# A step somebody has to do by hand around a deployment is declared as a deployment
# action of type manual (Lab 2.4), not in a spreadsheet kept somewhere else. With
# this, Save / Publish sends you to the DevOps Pipeline panel instead of asking
# for the URL of a manual actions file.
manualActionsMode: sfdxHardis
# A manual step to do before the deployment stops the check of its Pull Request until
# somebody marks it as done (Labs 2.4 and 3.5). sfdx-hardis only lists it by default.
failValidationOnPendingManualActions: true

# --- Quality --------------------------------------------------------------
testLevel: RunLocalTests
apexTestsMinCoverageOrgWide: 80
testCoverageNotBlocking: false
promotionConflictMarkersIgnoredFiles:
  - labs/*/level-2-contributor-advanced/2-7-resolve-a-git-merge-conflict.md
autoCleanTypes:
  - destructivechanges
  - localfields
  - productrequest
  - flowPositions
  - minimizeProfiles
autoRemoveUserPermissions:
  - EnableCommunityAppLauncher
  - FieldServiceAccess
  - OmnichannelInventorySync
  - SendExternalEmailAvailable
  - WorkCalibrationUser
dataPackages:
  - dataPath: scripts/data/HeliosBaseline
    importInScratchOrgs: false
  - dataPath: scripts/data/HeliosCrewRefData
    importInScratchOrgs: false
customCommandsPosition: first
customCommands:
  - id: training-level-1
    label: "Training: Level 1"
    description: Contributor basics - the commands the Level 1 labs ask for
    vscodeIcon: mortar-board
    sldsIcon: utility:education
    welcomeIconClass: cyan
    commands:
      - id: training-l1-init
        label: Set up my training environment
        vscodeIcon: repo-forked
        sldsIcon: utility:merge
        tooltip: Forks the repository, creates your scratch orgs with the Helios app, and wires the pipeline to them
        command: node scripts/training.mjs init
        helpUrl: https://sfdx-hardis-training.github.io/en/level-1-contributor-basics/1-2-create-your-dev-hub-scratch-orgs-and-pipeline/
      - id: training-l1-status
        label: Where am I?
        vscodeIcon: compass
        sldsIcon: utility:location
        tooltip: Shows the level and lab you reached, and what to do next
        command: node scripts/training.mjs status
        helpUrl: https://sfdx-hardis-training.github.io/
      - id: training-l1-check
        label: Check my work
        vscodeIcon: pass
        sldsIcon: utility:check
        tooltip: Verifies the Level 1 lab you just finished
        command: node scripts/training.mjs check --level 1
        helpUrl: https://sfdx-hardis-training.github.io/badges/
      - id: training-l1-trigger
        label: Trigger my workflows
        vscodeIcon: play-circle
        sldsIcon: utility:play
        tooltip: Pushes one line so a fork whose Actions you have just enabled starts the checks of your Pull Request
        command: node scripts/training.mjs trigger
        helpUrl: https://sfdx-hardis-training.github.io/en/level-1-contributor-basics/1-6-pull-request-deployment-check-and-merge/
      - id: training-l1-claim
        label: Claim my badge
        vscodeIcon: mortar-board
        sldsIcon: utility:favorite
        tooltip: Checks the whole of level 1, then opens the badge claim form with your answers already in it
        command: node scripts/training.mjs claim --level 1
        helpUrl: https://sfdx-hardis-training.github.io/badges/
      - id: training-l1-update
        label: Update my course
        vscodeIcon: sync
        sldsIcon: utility:sync
        tooltip: Brings the changes the course received since you forked it, through a Pull Request into integration
        command: node scripts/training.mjs update
        helpUrl: https://sfdx-hardis-training.github.io/en/help/#when-the-course-changed-after-you-forked
      - id: training-l1-reset
        label: Reset this level
        vscodeIcon: debug-restart
        sldsIcon: utility:refresh
        tooltip: Puts your repository back to the start of Level 1
        command: node scripts/training.mjs reset --level 1
        helpUrl: https://sfdx-hardis-training.github.io/en/level-1-contributor-basics/

