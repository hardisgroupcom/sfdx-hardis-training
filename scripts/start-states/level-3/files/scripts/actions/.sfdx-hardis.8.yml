# Deployment actions for Pull Request #8 (US-041).
# The object has to exist before the checklist rows can be loaded, so this one
# runs after the metadata, which is the opposite of the US-024 backfill.
commandsPostDeploy:
  - id: 4d5a6b70-1c33-4f92-b108-041000000001
    label: Load the handover checklist reference items
    type: data
    when: post-deploy
    parameters:
      sfdmuProject: HeliosHandoverRefData
    command: sf hardis:org:data:import --path scripts/data/HeliosHandoverRefData
    context: all
