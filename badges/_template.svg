<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="{{NAME}}">
  <title>{{NAME}} - {{HANDLE}}</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{HUE}}"/>
      <stop offset="100%" stop-color="#101935"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f9"/>
    </linearGradient>
  </defs>

  <circle cx="160" cy="160" r="152" fill="url(#ring)"/>
  <circle cx="160" cy="160" r="128" fill="url(#face)"/>
  <circle cx="160" cy="160" r="128" fill="none" stroke="{{HUE}}" stroke-width="3" opacity="0.5"/>

  <!-- Level marker -->
  <circle cx="160" cy="72" r="26" fill="{{HUE}}"/>
  <text x="160" y="82" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">{{LEVEL}}</text>

  <text x="160" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="2.5" fill="#5a6782">SALESFORCE DEVOPS</text>

  <text x="160" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700" fill="#101935">{{NAME}}</text>

  <line x1="80" y1="192" x2="240" y2="192" stroke="{{HUE}}" stroke-width="2" opacity="0.4"/>

  <text x="160" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="600" fill="#101935">{{HANDLE}}</text>

  <text x="160" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" fill="#5a6782">{{DATE}}</text>

  <text x="160" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" letter-spacing="1.5" fill="#8b96ac">CLOUDITY - sfdx-hardis</text>

  <text x="160" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="9" letter-spacing="1" fill="#a8b1c4">BADGE, NOT A CERTIFICATION</text>
</svg>
