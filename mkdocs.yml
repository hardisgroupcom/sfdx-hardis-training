site_name: Salesforce DevOps with sfdx-hardis
site_description: Three free learning paths, from your first Pull Request to owning the pipeline
site_url: https://hardisgroupcom.github.io/sfdx-hardis-training/
repo_url: https://github.com/hardisgroupcom/sfdx-hardis-training
repo_name: hardisgroupcom/sfdx-hardis-training
edit_uri: edit/main/labs/
copyright: Cloudity and friends

# The site is assembled by scripts/build/site.mjs, which copies labs/<locale>/,
# the assets, the backlog and the badge pages into site-src/. The source of
# truth stays plain markdown under labs/.
docs_dir: site-src

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - mdx_truly_sane_lists
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hardisgroupcom/sfdx-hardis
      name: sfdx-hardis on GitHub
    - icon: fontawesome/solid/book
      link: https://sfdx-hardis.cloudity.com/
      name: sfdx-hardis documentation

nav:
  - Home: index.md
  - "Level 1 - Contributor basics":
      - Start here: en/level-1/index.md
      - "Lab 0 - Install the tools and seed your orgs": en/level-1/lab-00-setup.md
      - "Lab 1 - Fork the repository and connect your pipeline": en/level-1/lab-01-fork-and-connect.md
      - "Lab 2 - Take US-014 from the backlog": en/level-1/lab-02-new-user-story.md
      - "Lab 3 - Build it in your org": en/level-1/lab-03-build-in-org.md
      - "Lab 4 - Publish it and read the package.xml diff": en/level-1/lab-04-publish.md
      - "Lab 5 - Open the Pull Request, get it green, merge": en/level-1/lab-05-pull-request.md
      - "Capstone - Deliver US-016 alone": en/level-1/lab-06-capstone.md
  - "Level 2 - Contributor advanced":
      - Start here: en/level-2/index.md
      - "Lab 0 - Your org is behind, catch it up": en/level-2/lab-00-refresh.md
      - "Lab 1 - US-021 will not deploy": en/level-2/lab-01-missing-dependency.md
      - "Lab 2 - US-024: the field cannot be required yet": en/level-2/lab-02-deployment-actions-apex.md
      - "Lab 3 - US-026: reference data and a batch must follow": en/level-2/lab-03-deployment-actions-data.md
      - "Lab 4 - US-027 fails the quality gate and the tests": en/level-2/lab-04-quality-and-tests.md
      - "Lab 5 - US-033: your Profile change disappeared": en/level-2/lab-05-profiles-overwrites.md
      - "Lab 6 - Marco merged first: resolve the conflict": en/level-2/lab-06-conflicts.md
      - "Lab 7 - You committed the wrong things: recover": en/level-2/lab-07-recover-selection.md
      - "Capstone - Deliver US-041": en/level-2/lab-08-capstone.md
  - "Level 3 - Release Manager":
      - Start here: en/level-3/index.md
      - "Lab 0 - Your pipeline stops at integration: finish it": en/level-3/lab-00-finish-the-pipeline.md
      - "Lab 1 - Wire CI authentication for three orgs": en/level-3/lab-01-ci-auth.md
      - "Lab 2 - Review and merge a contributor Pull Request": en/level-3/lab-02-review-pr.md
      - "Lab 3 - Deploy to integration and read what happened": en/level-3/lab-03-deploy-integration.md
      - "Lab 4 - Three Pull Requests collide": en/level-3/lab-04-overwrite-cleaning.md
      - "Lab 5 - Promote integration to UAT": en/level-3/lab-05-uat-release-notes.md
      - "Lab 6 - Ship to production and read your DORA metrics": en/level-3/lab-06-production.md
      - "Lab 7 - Production is broken: hotfix and retrofit": en/level-3/lab-07-hotfix-retrofit.md
      - "Lab 8 - Put production under monitoring": en/level-3/lab-08-monitoring.md
      - "Lab 9 - Generate the project documentation": en/level-3/lab-09-documentation.md
      - "Capstone - Run one full weekly release cycle": en/level-3/lab-10-capstone.md
