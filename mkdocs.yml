site_name: Salesforce DevOps with sfdx-hardis
site_description: Three free learning paths, from your first Pull Request to owning the pipeline
site_url: https://hardisgroupcom.github.io/sfdx-hardis-training/
repo_url: https://github.com/hardisgroupcom/sfdx-hardis-training
repo_name: hardisgroupcom/sfdx-hardis-training
edit_uri: edit/main/labs/
copyright: Cloudity and friends

# The site is assembled by scripts/build/site.mjs, which copies labs/<locale>/,
# the assets, the backlog and the badge pages into site-src/. The source of
# truth stays plain markdown under labs/.
docs_dir: site-src

# Theme, palette, fonts and extensions follow the product documentation site
# (https://sfdx-hardis.cloudity.com), so the course reads as part of the same
# product. The one deliberate difference is the lead colour: the product leads
# with Cloudity blue and accents in purple, the course swaps them. Details and
# the self-hosted fonts live in site-theme/stylesheets/extra.css, which
# scripts/build/site.mjs copies to site-src/theme/.
theme:
  name: material
  # Only for the banner that says the course is not finished. Delete the folder
  # and this line when it is.
  custom_dir: site-overrides
  language: en
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  logo: theme/images/cloudity-text-logo-white.svg
  favicon: theme/images/cloudity-logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      # background, foreground and colors mirror the product site's palette entries.
      # Zensical 0.0.57 accepts them and emits nothing from them, on both sites: the
      # stylesheet is what paints the page. They stay so the two configs read alike.
      background: "#FFFFFF"
      foreground: "#001135"
      colors:
        primary: "#660FF2"
        accent: "#0053FF"
        link: "#660FF2"
        header: "#660FF2"
        nav: "#FFFFFF"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      background: "#0A0620"
      foreground: "#FFFFFF"
      colors:
        primary: "#A87BFF"
        accent: "#4D8BFF"
        link: "#A87BFF"
        header: "#1B0A3F"
        nav: "#160C30"

plugins:
  - glightbox
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: site-src
      restrict_base_path: false
  - mdx_truly_sane_lists
  - toc:
      permalink: true

extra_css:
  - theme/stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - theme/javascripts/tables.js
  # The theme wraps every picture in a glightbox link but ships no viewer with
  # it, so a click used to leave the lab and land on a bare PNG. This opens it
  # over the page instead. See site-theme/javascripts/lightbox.js.
  - theme/javascripts/lightbox.js
  # A guard: the template puts nothing after the footer, so anything found
  # there came from a page swap that went wrong. See after-footer.js.
  - theme/javascripts/after-footer.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hardisgroupcom/sfdx-hardis
      name: sfdx-hardis on GitHub
    - icon: fontawesome/solid/book
      link: https://sfdx-hardis.cloudity.com/
      name: sfdx-hardis documentation
  generator: false

nav:
  # Lab entries carry no title on purpose: an entry without one takes the page's
  # own heading, so there is one source of truth and nothing to keep in step by
  # hand. Six of these had drifted from their pages before that rule.
  - Home: index.md
  - "Level 1 - Contributor basics":
      - Start here: en/level-1/index.md
      - en/level-1/lab-00-setup.md
      - en/level-1/lab-01-fork-and-connect.md
      - en/level-1/lab-02-new-user-story.md
      - en/level-1/lab-03-build-in-org.md
      - en/level-1/lab-04-publish.md
      - en/level-1/lab-05-pull-request.md
      - en/level-1/lab-06-capstone.md
  - "Level 2 - Contributor advanced":
      - Start here: en/level-2/index.md
      - en/level-2/lab-00-refresh.md
      - en/level-2/lab-01-missing-dependency.md
      - en/level-2/lab-02-deployment-actions-apex.md
      - en/level-2/lab-03-deployment-actions-data.md
      - en/level-2/lab-04-quality-and-tests.md
      - en/level-2/lab-05-profiles-overwrites.md
      - en/level-2/lab-06-conflicts.md
      - en/level-2/lab-07-recover-selection.md
      - en/level-2/lab-08-capstone.md
  - "Level 3 - Release Manager":
      - Start here: en/level-3/index.md
      - en/level-3/lab-00-finish-the-pipeline.md
      - en/level-3/lab-01-ci-auth.md
      - en/level-3/lab-02-review-pr.md
      - en/level-3/lab-03-deploy-integration.md
      - en/level-3/lab-04-overwrite-cleaning.md
      - en/level-3/lab-05-uat-release-notes.md
      - en/level-3/lab-06-production.md
      - en/level-3/lab-07-hotfix-retrofit.md
      - en/level-3/lab-08-monitoring.md
      - en/level-3/lab-09-documentation.md
      - en/level-3/lab-10-capstone.md
  - Backlog: BACKLOG.md
  - Badges: badges/index.md
  - Link map: labs/link-map.en.md
